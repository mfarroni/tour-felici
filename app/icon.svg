<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Gradiente cielo alba calda -->
    <linearGradient id="favSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E58348" />
      <stop offset="50%" stop-color="#F2A65A" />
      <stop offset="100%" stop-color="#FCD58E" />
    </linearGradient>

    <!-- Gradiente roccia Tre Cime - Luce -->
    <linearGradient id="favLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DF" />
      <stop offset="100%" stop-color="#E5BE78" />
    </linearGradient>

    <!-- Gradiente roccia Tre Cime - Ombra -->
    <linearGradient id="favShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F4239" />
      <stop offset="100%" stop-color="#241E1A" />
    </linearGradient>
  </defs>

  <!-- Cornice circolare blu navy del badge -->
  <circle cx="32" cy="32" r="30" fill="#1C2738" stroke="#F5E3B5" stroke-width="2.5" />

  <!-- Maschera tonda per il paesaggio -->
  <clipPath id="favClip">
    <circle cx="32" cy="32" r="27.5" />
  </clipPath>

  <g clip-path="url(#favClip)">
    <!-- Cielo -->
    <rect x="0" y="0" width="64" height="64" fill="url(#favSky)" />

    <!-- Sole nascente tra le cime -->
    <circle cx="32" cy="24" r="9" fill="#FFF8E7" opacity="0.95" />
    <!-- Raggi stilizzati ultra-puliti -->
    <line x1="32" y1="12" x2="32" y2="7" stroke="#FFF8E7" stroke-width="1.5" stroke-linecap="round" />
    <line x1="23" y1="16" x2="19" y2="12" stroke="#FFF8E7" stroke-width="1.5" stroke-linecap="round" />
    <line x1="41" y1="16" x2="45" y2="12" stroke="#FFF8E7" stroke-width="1.5" stroke-linecap="round" />
    <line x1="18" y1="24" x2="13" y2="24" stroke="#FFF8E7" stroke-width="1.5" stroke-linecap="round" />
    <line x1="46" y1="24" x2="51" y2="24" stroke="#FFF8E7" stroke-width="1.5" stroke-linecap="round" />

    <!-- TRE CIME DI LAVAREDO (Silhouette geometrica ad alto contrasto per 16x16 / 32x32) -->
    
    <!-- CIMA SINISTRA -->
    <!-- Versante luce -->
    <polygon points="23,24 26,26 24,38 20,38" fill="url(#favLight)" />
    <!-- Versante ombra -->
    <polygon points="23,24 20,38 15,38 17,29" fill="url(#favShadow)" />

    <!-- CIMA CENTRALE (Più alta) -->
    <!-- Versante luce -->
    <polygon points="32,18 36,22 35,38 30,38" fill="url(#favLight)" />
    <!-- Versante ombra -->
    <polygon points="32,18 30,38 26,38 27,27" fill="url(#favShadow)" />
    <polygon points="32,18 31,21 33,21" fill="#FFFFFF" />

    <!-- CIMA DESTRA -->
    <!-- Versante luce -->
    <polygon points="41,23 44,27 43,38 38,38" fill="url(#favLight)" />
    <!-- Versante ombra -->
    <polygon points="41,23 38,38 35,38 37,27" fill="url(#favShadow)" />
    <polygon points="41,23 40,25 42,25" fill="#FFFFFF" />

    <!-- Base di ghiaia e sentiero -->
    <polygon points="10,44 32,37 54,44 60,52 4,52" fill="#D8B57D" />
    <path d="M 32 38 Q 34 42 32 46 T 33 52" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />

    <!-- Targa stilizzata inferiore con acronimo TF e 1984 -->
    <rect x="10" y="44" width="44" height="13" rx="2.5" fill="#F5E3B5" stroke="#1C2738" stroke-width="1.2" />
    <text x="32" y="53" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="7.5" fill="#1C2738" text-anchor="middle" letter-spacing="1">
      TF 1984
    </text>
  </g>
</svg>
