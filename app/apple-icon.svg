<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%">
  <defs>
    <linearGradient id="favSkyGradApple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E58348" />
      <stop offset="50%" stop-color="#F2A65A" />
      <stop offset="100%" stop-color="#FCD58E" />
    </linearGradient>
    <linearGradient id="favGoldBannerApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E3B5" />
      <stop offset="100%" stop-color="#DCB76C" />
    </linearGradient>
    <clipPath id="favCircleClipApple">
      <circle cx="90" cy="85" r="76" />
    </clipPath>
  </defs>

  <!-- Bordo e cerchio stemma maglietta (senza sfondo quadrato esterno) -->
  <circle cx="90" cy="90" r="88" fill="#1C2738" stroke="#F5E3B5" stroke-width="4.5" />
  <circle cx="90" cy="90" r="83" fill="none" stroke="#E58348" stroke-width="1.5" />

  <g clip-path="url(#favCircleClipApple)">
    <!-- Cielo alba -->
    <rect x="0" y="0" width="180" height="135" fill="url(#favSkyGradApple)" />
    <!-- Sole nascente tra le Tre Cime -->
    <circle cx="90" cy="68" r="24" fill="#FFF8E7" />
    <!-- Raggi del sole -->
    <line x1="90" y1="36" x2="90" y2="22" stroke="#FFF8E7" stroke-width="2.5" stroke-linecap="round" />
    <line x1="68" y1="46" x2="58" y2="32" stroke="#FFF8E7" stroke-width="2.5" stroke-linecap="round" />
    <line x1="112" y1="46" x2="122" y2="32" stroke="#FFF8E7" stroke-width="2.5" stroke-linecap="round" />
    <line x1="50" y1="68" x2="36" y2="68" stroke="#FFF8E7" stroke-width="2.5" stroke-linecap="round" />
    <line x1="130" y1="68" x2="144" y2="68" stroke="#FFF8E7" stroke-width="2.5" stroke-linecap="round" />

    <!-- Tre Cime di Lavaredo -->
    <!-- Cima Sinistra -->
    <polygon points="65,65 72,72 66,101 56,101" fill="#FDF3DB" />
    <polygon points="65,65 56,101 43,101 48,81" fill="#3D3025" />

    <!-- Cima Centrale (più alta) -->
    <polygon points="90,47 101,61 95,101 83,101" fill="#FDF3DB" />
    <polygon points="90,47 83,101 72,101 76,68" fill="#3D3025" />
    <polygon points="90,47 86,54 94,54" fill="#FFFFFF" />

    <!-- Cima Destra -->
    <polygon points="115,61 126,75 119,101 108,101" fill="#FDF3DB" />
    <polygon points="115,61 108,101 99,101 104,76" fill="#3D3025" />
    <polygon points="115,61 112,67 119,67" fill="#FFFFFF" />

    <!-- Ghiaione e sentiero -->
    <polygon points="18,122 90,97 162,122 171,144 9,144" fill="#DEC091" />
    <path d="M 90 101 Q 94 112 88 122 T 92 137" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

    <!-- Targa Centrale TOUR FELICI SRL -->
    <rect x="14" y="112" width="152" height="27" rx="4" fill="url(#favGoldBannerApple)" stroke="#1C2738" stroke-width="2" />
    <text x="90" y="126" font-size="11" font-weight="900" fill="#1C2738" text-anchor="middle" font-family="'Inter', sans-serif" letter-spacing="0.7">
      TOUR FELICI SRL
    </text>
    <text x="90" y="135" font-size="6" font-weight="800" fill="#B36E27" text-anchor="middle" font-family="'Inter', sans-serif" letter-spacing="1.4">
      DOLOMITI SINCE 1984
    </text>
  </g>

  <!-- Arco inferiore EMOZIONI AD ALTA QUOTA -->
  <text x="90" y="160" font-size="7" font-weight="800" fill="#F5E3B5" text-anchor="middle" font-family="'Inter', sans-serif" letter-spacing="1.4">
    EMOZIONI AD ALTA QUOTA
  </text>
</svg>
