<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%">
  <defs>
    <linearGradient id="favSkyApple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E58348" />
      <stop offset="50%" stop-color="#F2A65A" />
      <stop offset="100%" stop-color="#FCD58E" />
    </linearGradient>

    <linearGradient id="favLightApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DF" />
      <stop offset="100%" stop-color="#E5BE78" />
    </linearGradient>

    <linearGradient id="favShadowApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F4239" />
      <stop offset="100%" stop-color="#241E1A" />
    </linearGradient>

    <linearGradient id="goldBannerApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E3B5" />
      <stop offset="100%" stop-color="#DCB76C" />
    </linearGradient>
  </defs>

  <!-- Sfondo 180x180 per Apple Touch Icon -->
  <rect width="180" height="180" rx="40" fill="#1C2738" />

  <g transform="translate(18, 18) scale(0.8)">
    <!-- Bordo circolare stemma -->
    <circle cx="90" cy="90" r="86" fill="#1C2738" stroke="#F5E3B5" stroke-width="4" />
    
    <clipPath id="appleFavClip">
      <circle cx="90" cy="85" r="80" />
    </clipPath>

    <g clip-path="url(#appleFavClip)">
      <rect x="0" y="0" width="180" height="180" fill="url(#favSkyApple)" />

      <!-- Sole nascente -->
      <circle cx="90" cy="65" r="22" fill="#FFF8E7" opacity="0.95" />
      <!-- Raggi stilizzati -->
      <g stroke="#FFF8E7" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
        <line x1="90" y1="35" x2="90" y2="20" />
        <line x1="68" y1="45" x2="56" y2="33" />
        <line x1="112" y1="45" x2="124" y2="33" />
        <line x1="55" y1="65" x2="40" y2="65" />
        <line x1="125" y1="65" x2="140" y2="65" />
      </g>

      <!-- Tre Cime di Lavaredo -->
      <!-- Cima Sinistra -->
      <polygon points="62,65 72,72 66,108 55,108" fill="url(#favLightApple)" />
      <polygon points="62,65 55,108 42,108 48,80" fill="url(#favShadowApple)" />

      <!-- Cima Centrale (Più alta) -->
      <polygon points="90,48 102,62 98,108 84,108" fill="url(#favLightApple)" />
      <polygon points="90,48 84,108 72,108 75,75" fill="url(#favShadowApple)" />
      <polygon points="90,48 87,55 93,55" fill="#FFFFFF" />

      <!-- Cima Destra -->
      <polygon points="118,63 128,75 122,108 108,108" fill="url(#favLightApple)" />
      <polygon points="118,63 108,108 98,108 105,75" fill="url(#favShadowApple)" />
      <polygon points="118,63 115,69 120,69" fill="#FFFFFF" />

      <!-- Ghiaione e sentiero alpino -->
      <polygon points="25,125 90,105 155,125 170,150 10,150" fill="#D8B57D" />
      <path d="M 90,107 Q 95,118 90,128 T 92,145" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

      <!-- Targa stemma -->
      <rect x="25" y="122" width="130" height="34" rx="6" fill="url(#goldBannerApple)" stroke="#1C2738" stroke-width="2.5" />
      <text x="90" y="142" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="14" fill="#1C2738" text-anchor="middle" letter-spacing="1.5">
        TOUR FELICI
      </text>
      <text x="90" y="152" font-family="'Inter', sans-serif" font-weight="800" font-size="8" fill="#B36E27" text-anchor="middle" letter-spacing="2">
        SINCE 1984
      </text>
    </g>
  </g>
</svg>
